{# 全站共用：生成分享內容彈窗 #}
<div id="share-content-modal"
     class="fixed inset-0 z-[110] hidden items-center justify-center bg-black/75 p-3 backdrop-blur-sm sm:p-4"
     role="dialog"
     aria-modal="true"
     aria-labelledby="share-modal-title">
  <div class="flex max-h-[94vh] w-full max-w-2xl flex-col overflow-hidden rounded-2xl border border-gold/35 bg-gradient-to-b from-fairway-dark via-[#0f2918] to-[#071810] shadow-2xl ring-1 ring-gold/25">
    <div class="flex shrink-0 items-start justify-between gap-3 border-b border-white/10 bg-black/30 px-5 py-4">
      <div>
        <p class="text-[10px] font-bold uppercase tracking-[0.2em] text-gold-light">Social Studio</p>
        <h2 id="share-modal-title" class="text-lg font-bold text-white sm:text-xl">生成分享內容</h2>
        <p class="mt-1 text-xs text-green-200/65">照片優先 · 適合抖音、小紅書、朋友圈</p>
      </div>
      <button type="button"
              id="share-modal-close"
              class="shrink-0 rounded-xl border border-white/15 px-3 py-1.5 text-sm text-green-200 transition hover:bg-white/10">
        關閉
      </button>
    </div>

    <div class="flex shrink-0 gap-2 border-b border-white/10 bg-black/20 px-4 py-3">
      <button type="button"
              data-share-tab="card"
              class="share-tab-btn flex-1 rounded-xl border border-gold/50 bg-gold/20 py-2.5 text-sm font-bold text-gold-light transition">
        🏆 戰報圖卡
      </button>
      <button type="button"
              data-share-tab="photo"
              class="share-tab-btn flex-1 rounded-xl border border-white/15 bg-white/5 py-2.5 text-sm font-semibold text-green-200/80 transition hover:bg-white/10">
        📷 照片
      </button>
      <button type="button"
              data-share-tab="video"
              class="share-tab-btn flex-1 rounded-xl border border-white/15 bg-white/5 py-2.5 text-sm font-semibold text-green-200/80 transition hover:bg-white/10">
        🎬 視頻
      </button>
    </div>

    <div class="min-h-0 flex-1 overflow-y-auto px-5 py-5">
      <div id="share-meta-bar" class="mb-5 hidden rounded-xl border border-white/10 bg-white/5 p-4 text-sm">
        <p class="font-semibold text-white" id="share-meta-course"></p>
        <p class="mt-1 text-green-200/70" id="share-meta-line"></p>
      </div>

      <div class="mb-4">
        <label class="mb-1.5 block text-xs font-bold uppercase tracking-wider text-gold-light/90">展示球員</label>
        <select id="share-player-select"
                class="w-full rounded-xl border border-white/15 bg-black/30 px-4 py-2.5 text-sm text-white focus:border-gold/50 focus:outline-none focus:ring-2 focus:ring-gold/30">
        </select>
      </div>

      {# 戰報圖卡模式（純前端生成 · 免上傳） #}
      <div id="share-panel-card" class="share-panel space-y-4">
        <div class="rounded-xl border border-emerald-500/25 bg-emerald-950/25 px-4 py-3 text-xs leading-relaxed text-emerald-100/85">
          免上傳照片，一鍵生成精緻戰報圖卡。挑選尺寸後點「下載圖卡」，即可發到小紅書、IG、朋友圈。
        </div>

        <div>
          <label class="mb-2 block text-xs font-bold uppercase tracking-wider text-gold-light/90">選擇尺寸</label>
          <div id="card-size-group" class="grid grid-cols-3 gap-2">
            <button type="button" data-card-size="xhs"
                    class="card-size-btn rounded-xl border border-gold/50 bg-gold/20 py-2.5 text-xs font-bold text-gold-light transition">
              小紅書 3:4
            </button>
            <button type="button" data-card-size="story"
                    class="card-size-btn rounded-xl border border-white/15 bg-white/5 py-2.5 text-xs font-semibold text-green-200/80 transition hover:bg-white/10">
              限動 9:16
            </button>
            <button type="button" data-card-size="square"
                    class="card-size-btn rounded-xl border border-white/15 bg-white/5 py-2.5 text-xs font-semibold text-green-200/80 transition hover:bg-white/10">
              方形 1:1
            </button>
          </div>
        </div>

        <div class="rounded-2xl bg-black/35 p-3 ring-1 ring-white/10">
          <canvas id="share-card-canvas" class="mx-auto block w-full max-w-[260px] rounded-lg shadow-2xl"></canvas>
        </div>

        <a id="share-card-download" download="maison-golf-card.png"
           class="flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-gold to-gold-light px-4 py-3.5 text-sm font-bold text-fairway-dark shadow-lg no-underline transition hover:brightness-110">
          <span aria-hidden="true">⬇️</span>
          下載圖卡
        </a>
        <p class="text-center text-[11px] text-green-200/45">提示：手機長按上方圖片亦可直接儲存</p>
      </div>

      {# 照片模式 #}
      <div id="share-panel-photo" class="share-panel hidden space-y-4">
        <div>
          <label class="mb-2 block text-xs font-bold uppercase tracking-wider text-gold-light/90">
            上傳球場照片或記分卡截圖
          </label>
          <label class="flex cursor-pointer flex-col items-center justify-center rounded-2xl border-2 border-dashed border-gold/40 bg-gold/5 px-4 py-8 transition hover:border-gold/60 hover:bg-gold/10">
            <span class="text-3xl" aria-hidden="true">📸</span>
            <span class="mt-2 text-sm font-semibold text-gold-light">點擊選擇圖片</span>
            <span class="mt-1 text-xs text-green-200/50">JPG / PNG / WEBP · 最大 12MB</span>
            <input type="file" id="share-photo-input" accept="image/*" class="sr-only" />
          </label>
          <p id="share-photo-filename" class="mt-2 hidden text-xs text-green-200/70"></p>
        </div>

        <div id="share-photo-preview-wrap" class="hidden">
          <p class="mb-2 text-xs font-bold uppercase tracking-wider text-emerald-300">本地預覽</p>
          <img id="share-photo-preview" alt="上傳預覽" class="max-h-40 w-full rounded-xl object-cover ring-1 ring-white/15" />
        </div>

        <button type="button"
                id="share-generate-photo"
                disabled
                class="flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-gold to-gold-light px-4 py-3.5 text-sm font-bold text-fairway-dark shadow-lg transition enabled:hover:brightness-110 disabled:cursor-not-allowed disabled:opacity-40">
          <span aria-hidden="true">✨</span>
          智能優化並生成 4 種風格
        </button>

        <div id="share-photo-results" class="hidden space-y-4">
          <p class="text-xs font-bold uppercase tracking-wider text-gold-light">生成結果 · 長按或點擊下載</p>
          <div id="share-photo-grid" class="grid gap-4 sm:grid-cols-2"></div>
        </div>
      </div>

      {# 視頻模式 #}
      <div id="share-panel-video" class="share-panel hidden space-y-4">
        <div class="rounded-xl border border-sky-500/25 bg-sky-950/30 px-4 py-3 text-xs leading-relaxed text-sky-100/85">
          上傳 15–30 秒打球短片，系統將自動裁切為直式 9:16、套用高爾夫濾鏡、疊加總桿與亮點洞文字，並可選配背景音樂（需伺服器已放置音檔或安裝 ffmpeg）。
        </div>

        <div>
          <label class="mb-2 block text-xs font-bold uppercase tracking-wider text-gold-light/90">上傳短視頻</label>
          <label class="flex cursor-pointer flex-col items-center justify-center rounded-2xl border-2 border-dashed border-sky-400/35 bg-sky-950/20 px-4 py-7 transition hover:border-sky-400/55">
            <span class="text-3xl" aria-hidden="true">🎥</span>
            <span class="mt-2 text-sm font-semibold text-sky-100">選擇 MP4 / MOV</span>
            <input type="file" id="share-video-input" accept="video/mp4,video/quicktime,video/webm" class="sr-only" />
          </label>
          <p id="share-video-filename" class="mt-2 hidden text-xs text-green-200/70"></p>
        </div>

        <div>
          <label class="mb-2 block text-xs font-bold uppercase tracking-wider text-gold-light/90">背景音樂</label>
          <select id="share-music-select"
                  class="w-full rounded-xl border border-white/15 bg-black/30 px-4 py-2.5 text-sm text-white">
            <option value="">無配樂（僅畫面）</option>
          </select>
          <p id="share-music-hint" class="mt-1.5 text-xs text-green-200/45"></p>
        </div>

        <div>
          <label class="mb-2 flex justify-between text-xs font-bold uppercase tracking-wider text-gold-light/90">
            <span>影片長度</span>
            <span id="share-duration-label" class="text-gold-light">25 秒</span>
          </label>
          <input type="range" id="share-duration-range" min="15" max="30" value="25"
                 class="w-full accent-gold" />
        </div>

        <button type="button"
                id="share-generate-video"
                disabled
                class="flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-sky-600 to-sky-500 px-4 py-3.5 text-sm font-bold text-white shadow-lg transition enabled:hover:brightness-110 disabled:cursor-not-allowed disabled:opacity-40">
          合成短視頻
        </button>

        <div id="share-video-result" class="hidden">
          <video id="share-video-player" controls playsinline
                 class="w-full rounded-xl ring-1 ring-white/15"></video>
          <a id="share-video-download"
             download="maison-golf-clip.mp4"
             class="mt-3 flex w-full items-center justify-center gap-2 rounded-xl border border-gold/40 bg-gold/15 py-3 text-sm font-bold text-gold-light no-underline transition hover:bg-gold/25">
            下載 MP4
          </a>
        </div>
      </div>

      <p id="share-status" class="mt-4 hidden rounded-xl px-4 py-3 text-sm"></p>
    </div>
  </div>
</div>
