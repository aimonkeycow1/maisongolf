<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050f0c">
  <meta name="description" content="滘西洲高爾夫球場南場 · 群組記分與歷史戰績">
  <title>{% block title %}滘西洲南場記分{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <a href="{{ url_for('index') }}" class="brand">
        <div class="brand-mark">⛳</div>
        <div class="brand-text">
          <div class="brand-name">Maison Golf</div>
          <div class="brand-sub">Kau Sai Chau · South</div>
        </div>
      </a>
      <nav class="nav">
        <a href="{{ url_for('index') }}" {% if page == 'home' %}class="active"{% endif %}>首頁</a>
        <a href="{{ url_for('score_entry') }}" {% if page == 'score' %}class="active"{% endif %}>錄分</a>
        <a href="{{ url_for('stats') }}" {% if page == 'stats' %}class="active"{% endif %}>統計</a>
      </nav>
    </header>
    {% block content %}{% endblock %}
    <footer class="footer">
      <p>滘西洲高爾夫球場 · 南場 · 白梯 Par 69</p>
      <p><a href="{{ url_for('score_entry') }}">網頁錄分</a> · <code>python3 golf_score.py</code></p>
    </footer>
  </div>
</body>
</html>
