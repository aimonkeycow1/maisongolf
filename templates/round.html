{% extends "base.html" %}
{% block title %}記分卡 · Maison Golf{% endblock %}
{% block content %}

<div id="round-root" data-round-id="{{ round_id }}">
  <div id="round-missing" class="hidden py-16 text-center">
    <p class="text-sm text-zinc-400">找不到這場紀錄</p>
    <a href="{{ url_for('index') }}" class="mt-4 inline-block rounded-lg bg-zinc-900 px-5 py-2.5 text-sm font-medium text-white no-underline hover:bg-zinc-700">回首頁</a>
  </div>
  <div id="round-content" class="hidden"></div>
</div>

<script>
(function () {
  var root = document.getElementById("round-root");
  var id = root.getAttribute("data-round-id");
  var round = MG.getRound(id);
  if (!round) {
    document.getElementById("round-missing").classList.remove("hidden");
    return;
  }
  var ranked = MG.rankedPlayers(round);
  var pt = round.par_total || 0;
  var e = MG.esc, tp = MG.toParText, cell = MG.scoreCellClass;
  var isVoice = round.input_mode === "voice";

  function holeGrid(holeResults, from, to) {
    var html = '<div class="grid grid-cols-9 gap-1">';
    holeResults.forEach(function (h) {
      if (h.hole < from || h.hole > to) return;
      html += '<div class="rounded p-1.5 text-center ' + cell(h.diff) + '">' +
        '<p class="text-[9px] opacity-70">' + h.hole + '</p>' +
        '<p class="text-base font-semibold tabular-nums leading-tight">' + h.score + '</p>' +
        '<p class="text-[9px] opacity-70">P' + h.par + '</p>' +
      '</div>';
    });
    return html + '</div>';
  }

  var html = "";

  // 標題
  var meta = e(round.date || "");
  if (round.time) meta += " · " + e(round.time);
  if (round.note) meta += " · " + e(round.note);
  html += '<header class="border-b border-zinc-200 pb-5">' +
    '<p class="text-xs font-medium uppercase tracking-[0.2em] text-zinc-400">' + (isVoice ? 'Voice Scorecard' : 'Scorecard') + '</p>' +
    '<h1 class="mt-1 text-xl font-semibold text-zinc-900">' + e(round.course || "自訂球場") + '</h1>' +
    '<p class="mt-1 text-sm text-zinc-500">' + meta + (isVoice ? ' · 語音記分' : '') + '</p>' +
  '</header>';

  // 摘要
  html += '<div class="mt-6 grid grid-cols-3 divide-x divide-zinc-200 rounded-xl border border-zinc-200 text-center">' +
    '<div class="py-4"><p class="text-xs text-zinc-400">總 Par</p><p class="mt-1 text-xl font-semibold tabular-nums text-zinc-900">' + pt + '</p></div>' +
    '<div class="py-4"><p class="text-xs text-zinc-400">洞數</p><p class="mt-1 text-xl font-semibold tabular-nums text-zinc-900">18</p></div>' +
    '<div class="py-4"><p class="text-xs text-zinc-400">球員</p><p class="mt-1 text-xl font-semibold tabular-nums text-zinc-900">' + ranked.length + '</p></div>' +
  '</div>';

  // 動作
  html += '<div class="mt-5 flex items-center justify-between gap-3">' +
    '<a href="/history" class="text-sm font-medium text-zinc-500 no-underline transition hover:text-zinc-900">← 歷史記錄</a>' +
    '<a href="/score" class="inline-flex items-center gap-1.5 rounded-lg bg-zinc-900 px-4 py-2.5 text-sm font-medium text-white no-underline transition hover:bg-zinc-700">＋ 開始新的一場</a>' +
  '</div>';

  // 排名
  html += '<section class="mt-8"><h2 class="mb-3 text-sm font-medium text-zinc-700">本場排名</h2><div class="space-y-2">';
  ranked.forEach(function (p, i) {
    html += '<div class="flex items-center gap-4 rounded-xl border p-4 ' + (i === 0 ? 'border-zinc-900' : 'border-zinc-200') + '">' +
      '<span class="w-5 text-center text-sm font-medium text-zinc-400">' + (i + 1) + '</span>' +
      '<div class="min-w-0 flex-1"><p class="truncate font-medium text-zinc-900">' + e(p.name) + '</p>' +
        '<p class="mt-0.5 text-xs text-zinc-400">前九 ' + p.front9 + ' · 後九 ' + p.back9 + '</p></div>' +
      '<div class="text-right"><p class="text-2xl font-semibold tabular-nums text-zinc-900 leading-none">' + p.total + '</p>' +
        '<p class="mt-1 text-sm text-zinc-500">' + tp(p.to_par) + '</p></div>' +
    '</div>';
  });
  html += '</div></section>';

  // 圖例
  html += '<div class="mt-6 flex flex-wrap items-center gap-4 text-xs text-zinc-400">' +
    '<span class="flex items-center gap-1.5"><span class="h-3 w-3 rounded bg-zinc-900"></span>低於 Par</span>' +
    '<span class="flex items-center gap-1.5"><span class="h-3 w-3 rounded bg-zinc-100 ring-1 ring-zinc-200"></span>Par</span>' +
    '<span class="flex items-center gap-1.5"><span class="h-3 w-3 rounded bg-white ring-1 ring-zinc-200"></span>高於 Par</span>' +
  '</div>';

  // 每位球員記分卡
  ranked.forEach(function (p) {
    html += '<article class="mt-6 overflow-hidden rounded-2xl border border-zinc-200">' +
      '<div class="flex items-end justify-between gap-4 border-b border-zinc-200 px-5 py-4">' +
        '<div><h2 class="text-base font-semibold text-zinc-900">' + e(p.name) + '</h2>' +
          '<p class="mt-0.5 text-xs text-zinc-400">Birdie ' + p.birdies + ' · Par ' + p.pars + ' · Bogey ' + p.bogeys + ' · Double+ ' + p.double_plus + (p.total_putts ? ' · 推桿 ' + p.total_putts : '') + '</p></div>' +
        '<div class="text-right"><p class="text-3xl font-semibold tabular-nums text-zinc-900 leading-none">' + p.total + '</p>' +
          '<p class="mt-1 text-xs text-zinc-500">' + tp(p.to_par) + '</p></div>' +
      '</div>' +
      '<div class="p-4">' +
        '<p class="mb-2 text-[11px] font-medium uppercase tracking-widest text-zinc-400">前九</p>' + holeGrid(p.hole_results, 1, 9) +
        '<p class="mb-2 mt-4 text-[11px] font-medium uppercase tracking-widest text-zinc-400">後九</p>' + holeGrid(p.hole_results, 10, 18) +
      '</div>' +
    '</article>';
  });

  if (isVoice && Array.isArray(round.voice_holes) && round.voice_holes.length) {
    html += '<section class="mt-8"><h2 class="mb-3 text-sm font-medium text-zinc-700">原始口述</h2><div class="space-y-2">';
    round.voice_holes.forEach(function (h) {
      html += '<div class="rounded-xl border border-zinc-200 px-4 py-3">' +
        '<p class="text-xs font-medium text-zinc-400">第 ' + h.hole + ' 洞</p>' +
        '<p class="mt-1 text-sm leading-relaxed text-zinc-700">' + e(h.raw_transcript || "") + '</p>' +
      '</div>';
    });
    html += '</div></section>';
  }

  var content = document.getElementById("round-content");
  content.innerHTML = html;
  content.classList.remove("hidden");
})();
</script>

{% endblock %}
