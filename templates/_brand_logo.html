{# Maison Golf · MG 標章（MG 為視覺主體） #}
<svg class="{{ classes | default('h-12 w-12 sm:h-[3.25rem] sm:w-[3.25rem]') }} shrink-0"
     viewBox="0 0 100 100"
     fill="none"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-hidden="true">
  <defs>
    <linearGradient id="mg-bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="mg-gold" x1="50" y1="0" x2="50" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  {# 圓角方牌 · 簡潔底 #}
  <rect x="4" y="4" width="92" height="92" rx="20" fill="url(#mg-bg)"/>
  <rect x="4" y="4" width="92" height="92" rx="20" stroke="url(#mg-gold)" stroke-width="1.5" opacity="0.9"/>

  {# 背景裝飾（低調，不搶 MG） #}
  <path d="M12 78Q50 66 88 78" stroke="rgba(255,255,255,0.12)" stroke-width="1.25" stroke-linecap="round" fill="none"/>
  <line x1="82" y1="18" x2="82" y2="38" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M82 18L92 22L82 26Z" fill="url(#mg-gold)" opacity="0.75"/>

  {# MG 主字 · 加粗填色 + 細金邊 #}
  <text x="50" y="58"
        text-anchor="middle"
        dominant-baseline="middle"
        font-family="Georgia, 'Times New Roman', 'Noto Serif TC', serif"
        font-size="46"
        font-weight="700"
        letter-spacing="-3"
        fill="#ffffff"
        stroke="url(#mg-gold)"
        stroke-width="0.6"
        paint-order="stroke fill">MG</text>

  {# 底部金色飾線 #}
  <path d="M28 82H72" stroke="url(#mg-gold)" stroke-width="1.25" stroke-linecap="round" opacity="0.85"/>
</svg>
