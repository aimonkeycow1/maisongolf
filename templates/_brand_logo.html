{# Maison Golf · MG 品牌 Logo（響應式 SVG） #}
<svg class="{{ classes | default('h-11 w-11 sm:h-12 sm:w-12') }} shrink-0 drop-shadow-[0_4px_12px_rgba(0,0,0,0.35)] transition duration-300 group-hover:drop-shadow-[0_6px_20px_rgba(234,179,8,0.25)]"
     viewBox="0 0 120 120"
     fill="none"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-labelledby="mg-logo-title">
  <title id="mg-logo-title">Maison Golf</title>
  <defs>
    <linearGradient id="mg-ring-grad" x1="12" y1="8" x2="108" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="55%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#0f2918"/>
    </linearGradient>
    <linearGradient id="mg-gold-grad" x1="60" y1="0" x2="60" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="45%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="mg-letter-grad" x1="24" y1="28" x2="96" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <clipPath id="mg-clip">
      <circle cx="60" cy="60" r="54"/>
    </clipPath>
  </defs>

  {# 外圈 · 奢華金邊 #}
  <circle cx="60" cy="60" r="57" stroke="url(#mg-gold-grad)" stroke-width="1.25" opacity="0.85"/>
  <circle cx="60" cy="60" r="54" fill="url(#mg-ring-grad)"/>
  <circle cx="60" cy="60" r="54" stroke="rgba(255,255,255,0.12)" stroke-width="0.75"/>

  {# 球道弧線 #}
  <path d="M18 82C34 68 86 68 102 82" stroke="rgba(255,255,255,0.14)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M28 88C44 78 76 78 92 88" stroke="#15803d" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <g clip-path="url(#mg-clip)">
    {# 旗杆 + 果嶺旗 #}
    <line x1="78" y1="26" x2="78" y2="72" stroke="rgba(255,255,255,0.92)" stroke-width="2" stroke-linecap="round"/>
    <path d="M78 26L96 33L78 40Z" fill="url(#mg-gold-grad)"/>
    <circle cx="78" cy="72" r="2.2" fill="url(#mg-gold-grad)"/>

    {# 球洞 #}
    <ellipse cx="60" cy="90" rx="14" ry="4.5" fill="#071810" opacity="0.55"/>
    <ellipse cx="60" cy="89" rx="9" ry="2.8" fill="#0f2918" stroke="url(#mg-gold-grad)" stroke-width="0.75" opacity="0.9"/>

    {# 優雅球桿揮桿弧 #}
    <path d="M14 95C28 52 52 38 72 48" stroke="url(#mg-gold-grad)" stroke-width="1.75" stroke-linecap="round" fill="none" opacity="0.55"/>

    {# M #}
    <path d="M26 78V42L36 58L46 42V78" stroke="url(#mg-letter-grad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    {# G #}
    <path d="M54 78V42H68C76 42 82 48 82 56C82 64 76 70 68 70H62V58" stroke="url(#mg-letter-grad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  {# 底部金色飾線 #}
  <path d="M38 102H82" stroke="url(#mg-gold-grad)" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
</svg>
