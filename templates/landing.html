{% extends "base.html" %}
{% block title %}Maison Golf · 極簡記分{% endblock %}
{% block content %}

<section class="py-16 text-center sm:py-24">
  <p class="text-xs font-medium uppercase tracking-[0.28em] text-zinc-400">Maison Golf</p>
  <h1 class="mx-auto mt-5 max-w-md text-3xl font-semibold leading-tight text-zinc-900 sm:text-4xl">
    一個純粹的<br>高爾夫記分工具
  </h1>
  <p class="mx-auto mt-4 max-w-sm text-base leading-relaxed text-zinc-500">
    拍記分卡自動讀 Par，逐洞快速輸入，<br class="hidden sm:block">
    打完 18 洞只要 30 秒。
  </p>

  <div class="mt-9 flex flex-col items-center justify-center gap-3 sm:flex-row">
    <a href="{{ url_for('auth.register') }}"
       class="rounded-xl bg-zinc-900 px-8 py-3.5 text-base font-medium text-white no-underline transition hover:bg-zinc-700">
      免費開始記分
    </a>
    <a href="{{ url_for('auth.login') }}"
       class="text-sm font-medium text-zinc-500 no-underline transition hover:text-zinc-900">
      已有帳號？登入
    </a>
  </div>
  <p class="mt-4 text-xs text-zinc-400">免費使用 · 不需信用卡</p>
</section>

<div class="mx-auto h-px w-full max-w-xs bg-zinc-200"></div>

<section class="grid gap-px overflow-hidden rounded-2xl border border-zinc-200 bg-zinc-200 sm:grid-cols-3">
  <div class="bg-white p-6 text-center">
    <p class="text-sm font-medium text-zinc-900">拍照讀 Par</p>
    <p class="mt-1.5 text-xs leading-relaxed text-zinc-400">拍下記分卡，自動辨識每洞 Par</p>
  </div>
  <div class="bg-white p-6 text-center">
    <p class="text-sm font-medium text-zinc-900">逐洞快速記分</p>
    <p class="mt-1.5 text-xs leading-relaxed text-zinc-400">大按鈕、可滑動，戴手套也好按</p>
  </div>
  <div class="bg-white p-6 text-center">
    <p class="text-sm font-medium text-zinc-900">多人同組</p>
    <p class="mt-1.5 text-xs leading-relaxed text-zinc-400">即時比分，打完自動成卡</p>
  </div>
</section>

{% endblock %}
