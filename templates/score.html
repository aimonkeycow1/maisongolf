{% extends "base.html" %}
{% block title %}網頁錄分 · 滘西洲南場{% endblock %}
{% block content %}

<section class="relative mb-8 overflow-hidden rounded-2xl shadow-2xl ring-1 ring-white/10">
  <div class="hero-bg-image absolute inset-0"></div>
  <div class="absolute inset-0 bg-gradient-to-r from-fairway-dark/95 to-fairway-dark/60"></div>
  <div class="relative px-6 py-10 sm:px-10">
    <p class="mb-2 text-xs font-semibold uppercase tracking-widest text-gold-light">Live Scoring</p>
    <h1 class="text-2xl font-bold text-white sm:text-3xl">多人同組錄分</h1>
    <p class="mt-2 text-green-100/80">{{ course_name }} · 白梯 Par {{ par_total }}</p>
  </div>
</section>

<div id="score-app" class="space-y-6">

  {# Step 1 #}
  <section id="step-setup" class="rounded-2xl bg-white p-6 shadow-xl ring-1 ring-green-900/10 sm:p-8">
    <div class="mb-6 flex items-center justify-between">
      <h2 class="text-lg font-bold text-fairway-dark">球友設定</h2>
      <span class="rounded-full bg-fairway/10 px-3 py-1 text-xs font-semibold text-fairway">Step 1</span>
    </div>

    <label class="mb-4 block">
      <span class="mb-2 block text-sm font-medium text-green-800">今天幾位球友？</span>
      <select id="player-count"
              class="w-full rounded-lg border border-green-200 bg-green-50 px-4 py-3 text-green-900 focus:border-fairway focus:outline-none focus:ring-2 focus:ring-fairway/30">
        {% for n in range(1, 9) %}
        <option value="{{ n }}" {% if n == 4 %}selected{% endif %}>{{ n }} 位</option>
        {% endfor %}
      </select>
    </label>

    <div id="player-names" class="mb-4 space-y-3"></div>

    <label class="mb-4 block">
      <span class="mb-2 block text-sm font-medium text-green-800">備註（可留空）</span>
      <input type="text" id="round-note" placeholder="例：6/1 天晴"
             class="w-full rounded-lg border border-green-200 bg-green-50 px-4 py-3 text-green-900 placeholder:text-green-400 focus:border-fairway focus:outline-none focus:ring-2 focus:ring-fairway/30">
    </label>

    {% if secret_required %}
    <label class="mb-6 block">
      <span class="mb-2 block text-sm font-medium text-green-800">管理員密鑰</span>
      <input type="password" id="sync-key" placeholder="Render 的 SYNC_SECRET" autocomplete="off"
             class="w-full rounded-lg border border-green-200 bg-green-50 px-4 py-3 text-green-900 focus:border-fairway focus:outline-none focus:ring-2 focus:ring-fairway/30">
      <span class="mt-1 block text-xs text-green-600">與同步腳本使用的是同一組密鑰</span>
    </label>
    {% endif %}

    <button type="button" id="btn-start"
            class="w-full rounded-xl bg-fairway py-3.5 text-base font-semibold text-white shadow-lg transition hover:bg-fairway-light focus:outline-none focus:ring-2 focus:ring-fairway focus:ring-offset-2">
      開始逐洞記分 →
    </button>
  </section>

  {# Step 2 #}
  <section id="step-holes" class="rounded-2xl bg-white p-6 shadow-xl ring-1 ring-green-900/10 sm:p-8" hidden>
    <div class="mb-4 h-1.5 overflow-hidden rounded-full bg-green-100">
      <div id="progress-bar" class="h-full rounded-full bg-gradient-to-r from-fairway to-gold transition-all duration-300" style="width:0%"></div>
    </div>
    <p id="hole-counter" class="mb-4 text-lg font-bold text-fairway-dark">第 1 洞 / 18</p>
    <div id="hole-info"></div>
    <div id="hole-inputs" class="mt-4 space-y-6"></div>
    <div class="mt-6 flex flex-wrap gap-3">
      <button type="button" id="btn-prev" disabled
              class="flex-1 min-w-[120px] rounded-xl border border-green-200 bg-green-50 py-3 font-semibold text-fairway-dark transition hover:bg-green-100 disabled:opacity-40">
        ← 上一洞
      </button>
      <button type="button" id="btn-next"
              class="flex-1 min-w-[120px] rounded-xl bg-fairway py-3 font-semibold text-white shadow transition hover:bg-fairway-light">
        下一洞 →
      </button>
    </div>
  </section>

  {# Step 3 #}
  <section id="step-review" class="rounded-2xl bg-white p-6 shadow-xl ring-1 ring-green-900/10 sm:p-8" hidden>
    <div class="mb-6 flex items-center justify-between">
      <h2 class="text-lg font-bold text-fairway-dark">確認並存檔</h2>
      <span class="rounded-full bg-fairway/10 px-3 py-1 text-xs font-semibold text-fairway">Step 3</span>
    </div>
    <div id="review-board"></div>
    <p id="submit-error" class="mt-4 hidden rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"></p>
    <div class="mt-6 flex flex-wrap gap-3">
      <button type="button" id="btn-back-edit"
              class="flex-1 min-w-[120px] rounded-xl border border-green-200 bg-green-50 py-3 font-semibold text-fairway-dark hover:bg-green-100">
        ← 修改成績
      </button>
      <button type="button" id="btn-save"
              class="flex-1 min-w-[160px] rounded-xl bg-fairway py-3 font-semibold text-white shadow hover:bg-fairway-light">
        存入並查看記分卡
      </button>
    </div>
  </section>
</div>

<script>
const COURSE = {{ course|tojson }};
const SECRET_REQUIRED = {{ secret_required|tojson }};
const PAR_TOTAL = {{ par_total }};

(function () {
  const HOLES = 18;
  let players = [], scores = [], holeIndex = 0;
  const el = (id) => document.getElementById(id);

  const SCORE_TW = {
    eagle: "bg-blue-600 text-white",
    birdie: "bg-green-700 text-white",
    par: "bg-white text-green-900 ring-1 ring-green-200",
    bogey: "bg-orange-500 text-white",
    bad: "bg-red-600 text-white",
  };

  function scoreKey(diff) {
    if (diff <= -2) return "eagle";
    if (diff === -1) return "birdie";
    if (diff === 0) return "par";
    if (diff === 1) return "bogey";
    return "bad";
  }

  function scoreLabel(diff) {
    const n = { "-3": "信天翁", "-2": "Eagle", "-1": "Birdie", "0": "Par", "1": "Bogey", "2": "Double" };
    const k = String(diff);
    return n[k] || (diff > 0 ? `+${diff}` : String(diff));
  }

  function buildPlayerNames() {
    const n = parseInt(el("player-count").value, 10);
    const box = el("player-names");
    box.innerHTML = "";
    for (let i = 0; i < n; i++) {
      const wrap = document.createElement("label");
      wrap.className = "block";
      wrap.innerHTML = `<span class="mb-1 block text-sm font-medium text-green-800">第 ${i + 1} 位</span>`;
      const input = document.createElement("input");
      input.type = "text";
      input.className = "player-name-input w-full rounded-lg border border-green-200 bg-green-50 px-4 py-3 text-green-900 focus:border-fairway focus:outline-none focus:ring-2 focus:ring-fairway/30";
      input.placeholder = `球友 ${i + 1}`;
      wrap.appendChild(input);
      box.appendChild(wrap);
    }
  }

  function showStep(name) {
    ["setup", "holes", "review"].forEach((s) => {
      el(`step-${s}`).hidden = s !== name;
    });
  }

  function startScoring() {
    players = [...document.querySelectorAll(".player-name-input")].map((inp, i) => inp.value.trim() || `球友${i + 1}`);
    scores = players.map(() => Array(HOLES).fill(null));
    holeIndex = 0;
    showStep("holes");
    renderHole();
  }

  function renderHole() {
    const h = holeIndex + 1;
    const par = COURSE.pars[holeIndex];
    const yard = COURSE.yardages[holeIndex];
    const hcp = COURSE.handicap[holeIndex];
    const section = holeIndex < 9 ? "前九洞" : "後九洞";

    el("hole-counter").textContent = `第 ${h} 洞 / 18 · ${section}`;
    el("progress-bar").style.width = `${((holeIndex + 1) / HOLES) * 100}%`;
    el("hole-info").innerHTML = `
      <div class="grid grid-cols-3 gap-3 rounded-xl bg-fairway-dark p-4 text-center text-white">
        <div><p class="text-xs text-gold-light">Par</p><p class="text-xl font-bold">${par}</p></div>
        <div><p class="text-xs text-gold-light">碼數</p><p class="text-xl font-bold">${yard}</p></div>
        <div><p class="text-xs text-gold-light">差點</p><p class="text-xl font-bold">${hcp}</p></div>
      </div>`;

    const container = el("hole-inputs");
    container.innerHTML = "";
    players.forEach((name, pi) => {
      const val = scores[pi][holeIndex];
      const diff = val !== null ? val - par : null;
      const key = diff !== null ? scoreKey(diff) : "";
      const row = document.createElement("div");
      row.className = "border-b border-green-100 pb-5 last:border-0";
      row.innerHTML = `
        <p class="mb-3 font-bold text-fairway-dark">${name}</p>
        <div class="mb-3 grid grid-cols-4 gap-2">
          <button type="button" data-pi="${pi}" data-val="${Math.max(1, par - 1)}"
            class="tap-btn rounded-lg border border-green-200 py-2.5 text-sm font-semibold text-fairway-dark hover:bg-green-50">${Math.max(1, par - 1)}</button>
          <button type="button" data-pi="${pi}" data-val="${par}"
            class="tap-btn rounded-lg bg-fairway py-2.5 text-sm font-semibold text-white">${par}</button>
          <button type="button" data-pi="${pi}" data-val="${par + 1}"
            class="tap-btn rounded-lg border border-green-200 py-2.5 text-sm font-semibold hover:bg-green-50">${par + 1}</button>
          <button type="button" data-pi="${pi}" data-val="${par + 2}"
            class="tap-btn rounded-lg border border-green-200 py-2.5 text-sm font-semibold hover:bg-green-50">${par + 2}</button>
        </div>
        <div class="flex items-center gap-3">
          <input type="number" min="1" max="20" data-pi="${pi}" value="${val !== null ? val : ""}" placeholder="桿"
            class="score-input w-20 rounded-lg border border-green-200 bg-green-50 px-3 py-2 text-center text-2xl font-bold text-fairway-dark focus:border-fairway focus:outline-none focus:ring-2 focus:ring-fairway/30">
          <span data-hint="${pi}" class="score-hint rounded-full px-3 py-1 text-sm font-semibold ${diff !== null ? SCORE_TW[key] : "hidden"}">${diff !== null ? scoreLabel(diff) : ""}</span>
        </div>`;
      container.appendChild(row);
    });

    container.querySelectorAll(".tap-btn").forEach((btn) => {
      btn.addEventListener("click", () => setScore(+btn.dataset.pi, +btn.dataset.val));
    });
    container.querySelectorAll(".score-input").forEach((inp) => {
      inp.addEventListener("change", () => {
        const v = parseInt(inp.value, 10);
        if (v >= 1 && v <= 20) setScore(+inp.dataset.pi, v);
      });
    });

    el("btn-prev").disabled = holeIndex === 0;
    el("btn-next").textContent = holeIndex === HOLES - 1 ? "查看總成績 →" : "下一洞 →";
  }

  function setScore(pi, val) {
    if (val < 1 || val > 20) return;
    scores[pi][holeIndex] = val;
    const par = COURSE.pars[holeIndex];
    const diff = val - par;
    const key = scoreKey(diff);
    const inp = document.querySelector(`.score-input[data-pi="${pi}"]`);
    const hint = document.querySelector(`.score-hint[data-hint="${pi}"]`);
    if (inp) inp.value = val;
    if (hint) {
      hint.textContent = scoreLabel(diff);
      hint.className = `score-hint rounded-full px-3 py-1 text-sm font-semibold ${SCORE_TW[key]}`;
    }
  }

  function allFilled() {
    return scores.every((row) => row.every((s) => s !== null && s >= 1));
  }

  function calcTotal(pi) {
    return scores[pi].reduce((a, b) => a + b, 0);
  }

  function showReview() {
    if (!allFilled()) { alert("請為每位球友填完本洞桿數"); return; }
    if (holeIndex < HOLES - 1) { holeIndex++; renderHole(); return; }
    showStep("review");
    const ranked = players.map((name, i) => ({ name, total: calcTotal(i) })).sort((a, b) => a.total - b.total);
    el("review-board").innerHTML = `
      <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
        ${ranked.map((p, i) => `
          <div class="rounded-xl border p-4 text-center ${i === 0 ? "border-gold/50 bg-gold/5" : "border-green-100 bg-green-50"}">
            <p class="text-2xl">${i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : i + 1}</p>
            <p class="mt-1 font-bold text-fairway-dark">${p.name}</p>
            <p class="text-3xl font-bold tabular-nums text-fairway">${p.total}</p>
            <p class="text-sm text-green-700">${p.total - PAR_TOTAL >= 0 ? "+" : ""}${p.total - PAR_TOTAL}</p>
          </div>`).join("")}
      </div>
      <p class="mt-4 text-center text-sm text-green-600">確認後存檔，會立即出現在歷史戰績。</p>`;
    el("submit-error").classList.add("hidden");
  }

  async function saveRound() {
    const errEl = el("submit-error");
    errEl.classList.add("hidden");
    const payload = {
      note: el("round-note").value.trim(),
      players: players.map((name, i) => ({ name, scores: scores[i] })),
    };
    if (SECRET_REQUIRED) {
      payload.sync_key = el("sync-key").value.trim();
      if (!payload.sync_key) {
        errEl.textContent = "請填寫管理員密鑰";
        errEl.classList.remove("hidden");
        return;
      }
    }
    const btn = el("btn-save");
    btn.disabled = true;
    btn.textContent = "存檔中…";
    try {
      const res = await fetch("{{ url_for('score_entry') }}", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || "存檔失敗");
      window.location.href = data.redirect || `/round/${data.id}`;
    } catch (e) {
      errEl.textContent = e.message || "網路錯誤";
      errEl.classList.remove("hidden");
      btn.disabled = false;
      btn.textContent = "存入並查看記分卡";
    }
  }

  el("player-count").addEventListener("change", buildPlayerNames);
  el("btn-start").addEventListener("click", startScoring);
  el("btn-prev").addEventListener("click", () => { if (holeIndex > 0) { holeIndex--; renderHole(); } });
  el("btn-next").addEventListener("click", showReview);
  el("btn-back-edit").addEventListener("click", () => { holeIndex = HOLES - 1; showStep("holes"); renderHole(); });
  el("btn-save").addEventListener("click", saveRound);
  buildPlayerNames();
})();
</script>
{% endblock %}
