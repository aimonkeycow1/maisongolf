{% extends "base.html" %}
{% block title %}Maison Golf · 極簡記分{% endblock %}
{% block content %}

{# 續打草稿提示（由 JS 顯示） #}
<section id="resume-draft"
         class="mb-6 hidden rounded-xl border border-zinc-200 px-4 py-3.5">
  <div class="flex items-start justify-between gap-3">
    <div class="min-w-0">
      <p class="text-sm font-medium text-zinc-900">繼續未完成的記分</p>
      <p id="resume-sub" class="mt-0.5 truncate text-xs text-zinc-400"></p>
    </div>
    <a href="{{ url_for('score_entry') }}"
       class="shrink-0 text-sm font-medium text-zinc-900 no-underline">繼續 →</a>
  </div>
  <button type="button" id="end-draft"
          class="mt-3 w-full rounded-lg border border-zinc-200 py-2.5 text-sm font-medium text-zinc-500 transition hover:border-zinc-400 hover:text-zinc-900">
    結束該局
  </button>
</section>

<a id="resume-voice" href="{{ url_for('voice_score_entry') }}"
   class="mb-6 hidden items-center justify-between gap-3 rounded-xl border border-zinc-900 px-4 py-3.5 no-underline transition hover:bg-zinc-50">
  <div class="min-w-0">
    <p class="text-sm font-medium text-zinc-900">繼續語音記分</p>
    <p id="resume-voice-sub" class="mt-0.5 truncate text-xs text-zinc-500"></p>
  </div>
  <span class="shrink-0 text-sm font-medium text-zinc-900">繼續 →</span>
</a>

{# 主按鈕：語音優先，手動備援 #}
<section class="py-8 text-center">
  <p class="text-sm text-zinc-400">不用低頭，說一句就記好</p>
  <a href="{{ url_for('voice_score_entry', new=1) }}"
     class="mt-6 inline-flex items-center justify-center gap-2 rounded-xl bg-zinc-900 px-7 py-4 text-base font-medium text-white no-underline transition active:scale-[0.99] hover:bg-zinc-700">
    <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a3.75 3.75 0 003.75-3.75V6a3.75 3.75 0 10-7.5 0v9A3.75 3.75 0 0012 18.75z"/><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 12.75v2.25a7.5 7.5 0 01-15 0v-2.25M12 22.5v-3.75"/></svg>
    開始語音記分
  </a>
  <div class="mt-4">
    <a href="{{ url_for('score_entry') }}" class="text-sm font-medium text-zinc-400 no-underline transition hover:text-zinc-900">改用手動記分</a>
  </div>
</section>

{# 最近場次（最多 3 場，由 JS 渲染） #}
<section id="recent-wrap" class="mt-8 hidden">
  <div class="mb-2 flex items-center justify-between">
    <h2 class="text-sm font-medium text-zinc-700">最近場次</h2>
    <a href="{{ url_for('history') }}" class="text-sm font-medium text-zinc-400 no-underline transition hover:text-zinc-900">查看全部 →</a>
  </div>
  <div id="recent-list" class="divide-y divide-zinc-100"></div>
</section>

{# 空狀態 #}
<div id="empty-state" class="mt-10 hidden text-center">
  <p class="text-sm text-zinc-400">還沒有場次紀錄</p>
  <p class="mt-1 text-xs text-zinc-300">點上面的按鈕，開始你的第一場</p>
</div>

<script>
(function () {
  // 續打提示
  var draft = MG.getDraft();
  if (draft && Array.isArray(draft.players) && draft.players.length) {
    var hole = (draft.hole_index || 0) + 1;
    var course = (draft.note && draft.note.trim()) || "自訂球場";
    document.getElementById("resume-sub").textContent = course + " · 第 " + hole + " 洞";
    var a = document.getElementById("resume-draft");
    a.classList.remove("hidden");
    var endDraft = document.getElementById("end-draft");
    endDraft.addEventListener("click", function () {
      MG.clearDraft();
      a.classList.add("hidden");
      if (!MG.allRounds().length) document.getElementById("empty-state").classList.remove("hidden");
    });
  }

  var voice = MG.getVoiceDraft ? MG.getVoiceDraft() : null;
  if (voice && voice.status === "in_progress") {
    var sub = (voice.course || "自訂球場") + " · 第 " + (voice.current_hole || 1) + " 洞";
    document.getElementById("resume-voice-sub").textContent = sub;
    var va = document.getElementById("resume-voice");
    va.classList.remove("hidden");
    va.classList.add("flex");
  }

  // 最近場次
  var rounds = MG.allRounds().slice().reverse();
  if (!rounds.length) {
    document.getElementById("empty-state").classList.remove("hidden");
    return;
  }
  document.getElementById("recent-wrap").classList.remove("hidden");
  var list = document.getElementById("recent-list");
  list.innerHTML = rounds.slice(0, 3).map(function (r) {
    var ranked = MG.rankedPlayers(r);
    var best = ranked[0] || { total: 0, to_par: 0 };
    var isVoice = r.input_mode === "voice";
    return '<a href="/round/' + encodeURIComponent(r.id) + '" class="flex items-center gap-4 py-4 no-underline transition hover:opacity-70">' +
      '<span class="w-12 text-center text-2xl font-semibold tabular-nums text-zinc-900">' + best.total + '</span>' +
      '<div class="min-w-0 flex-1">' +
        '<p class="truncate text-sm font-medium text-zinc-900">' + (isVoice ? '<span class="mr-1 rounded bg-zinc-100 px-1.5 py-0.5 text-[10px] text-zinc-500">語音</span>' : '') + MG.esc(r.course || "自訂球場") + '</p>' +
        '<p class="mt-0.5 text-xs text-zinc-400">' + MG.esc(r.date || "") + ' · ' + (r.players || []).length + ' 人</p>' +
      '</div>' +
      '<span class="inline-flex items-center rounded-md border border-zinc-200 bg-zinc-50 px-2 py-0.5 text-xs font-medium tabular-nums text-zinc-700">' + MG.toParText(best.to_par) + '</span>' +
    '</a>';
  }).join("");
})();
</script>

{% endblock %}
