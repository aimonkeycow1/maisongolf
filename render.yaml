# Render 部署：https://render.com
#
# 版本：Maison Golf 極簡測試版（零登入 + 本地儲存）
# - 場次／成績資料存在使用者「瀏覽器 localStorage」，伺服器不保存。
# - 因此「不需要」PostgreSQL；容器內 SQLite 僅供框架初始化，重部署清空無妨。
# - 拍照讀 Par 預設使用 OCR_MOCK（模擬資料），方便手機直接測試流程。
#
# 切換真實 Grok Vision 辨識：
#   在 Render Dashboard → Environment 設定 XAI_API_KEY，並把 OCR_MOCK 改成 false。

services:
  - type: web
    name: maisongolf
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"

      # Flask session 密鑰（零登入也保留，無害）；首次建立時自動產生
      - key: SECRET_KEY
        generateValue: true

      # ── 拍照讀 Par ─────────────────────────────────────────────
      # 測試版預設 true（模擬資料）。要用真實辨識：設 false 並提供 XAI_API_KEY。
      - key: OCR_MOCK
        value: "true"
      # - key: XAI_API_KEY
      #   value: "YOUR_XAI_API_KEY_HERE"

      # 強制停用本機開發工具（測試面板）
      - key: DEV_TEST_MODE
        value: "0"
