# Render 一鍵部署設定：https://render.com
services:
  - type: web
    name: kau-sai-golf
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SYNC_SECRET
        generateValue: true
